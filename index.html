<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>white-wolf-tasks</title>
  </head>
  <body>
    <div class="white-wolf-tasks" data-page="main">
      <div class="sidebar visually-hidden">
        <div class="sidebar__header">
          <div class="sidebar__user">
            <button class="button">
              <img src="" alt="user avatar" class="user__avatar" />
            </button>
            <p class="sidebar__user-name">Твой ник</p>
          </div>
          <button
            id="close-sidebar-button"
            class="button button--theme--transparent button--size--100-squared is-rotated"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="60"
              fill="none"
            >
              <g clip-path="url(#a)">
                <path
                  d="M.503 57.919.61 2.353 18.94 29.55.503 57.919Z"
                  stroke="currentColor"
                />
                <path
                  d="m16.038 29.554-13.51 21v-42l13.51 21Z"
                  fill="currentColor"
                />
              </g>
              <defs>
                <clipPath id="a">
                  <path d="M0 60V0h20v60z" fill="transparent" />
                </clipPath>
              </defs>
            </svg>
          </button>
        </div>
        <div class="sidebar__content">
          <div class="sidebar__cell">
            <button
              class="button button--theme--yellow-400 button--size--92-stretched"
              id="add-new-list"
            >
              <span class="button__icon">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="72"
                  height="72"
                  viewBox="0 0 72 72"
                  fill="none"
                >
                  <path
                    fill="currentColor"
                    d="M35.685 72 32.13 45.947h7.11L35.685 72ZM35.684 0l3.555 26.052h-7.11L35.684 0ZM72 35.684 45.947 39.24v-7.111L72 35.684ZM0 35.684l26.053-3.555v7.11L0 35.684ZM35.81 42 42 35.81l-6.19-6.189-6.189 6.19L35.811 42Z"
                  />
                  <path
                    stroke="currentColor"
                    d="m35.91 44.135 8.225-8.225-8.225-8.225-8.225 8.225 8.225 8.225Z"
                  />
                </svg>
              </span>
              <span class="button__text"> Добавить новый список </span>
            </button>
          </div>

          <div class="sidebar__cell">
            <button
              class="button button--theme--yellow-400 button--size--42-stretched is-modified"
              id="sidebar-nav-lists"
            >
              <span class="button__text">Твои списки дел</span>
            </button>
            <ul class="todo-lists" data-placement="sidebar"></ul>
          </div>

          <div class="sidebar__cell">
            <button
              class="button button--theme--yellow-400 button--size--42-stretched is-modified"
              id="sidebar-nav-tags"
            >
              <span class="button__text">Теги</span>
            </button>
            <ul class="sidebar__list">
              <li class="sidebar__item">
                <button
                  class="button button--size--size-48 button--theme--transparent-underlined is-separator-enabled button--align--start"
                  id="difficulty"
                >
                  <span class="button__text"> Сложность </span>
                  <span class="button__separator">
                    <span
                      class="separator separator--type--horizontal separator--theme--gray-1100-outlined has-rhombus"
                    ></span>
                    <span class="rhombus rhombus--size--8"></span>
                    <span
                      class="separator separator--type--horizontal separator--theme--gray-1100-outlined has-rhombus"
                    ></span>
                  </span>
                </button>
              </li>
              <li class="sidebar__item">
                <button
                  class="button button--size--size-48 button--theme--transparent-underlined is-separator-enabled button--align--start"
                  id="assignee"
                >
                  <span class="button__text"> Ответственный </span>
                  <span class="button__separator">
                    <span
                      class="separator separator--type--horizontal separator--theme--gray-1100-outlined has-rhombus"
                    ></span>
                    <span class="rhombus rhombus--size--8"></span>
                    <span
                      class="separator separator--type--horizontal separator--theme--gray-1100-outlined has-rhombus"
                    ></span>
                  </span>
                </button>
              </li>
            </ul>
          </div>
        </div>
      </div>
      <div class="main">
        <div class="header">
          <div id="sidebar-action" class="header__action">
            <button
              id="open-sidebar-button"
              class="button button--theme--transparent button--size--100-squared"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="60"
                fill="none"
              >
                <g clip-path="url(#a)">
                  <path
                    d="M.503 57.919.61 2.353 18.94 29.55.503 57.919Z"
                    stroke="currentColor"
                  />
                  <path
                    d="m16.038 29.554-13.51 21v-42l13.51 21Z"
                    fill="currentColor"
                  />
                </g>
                <defs>
                  <clipPath id="a">
                    <path d="M0 60V0h20v60z" fill="transparent" />
                  </clipPath>
                </defs>
              </svg>
            </button>
          </div>
          <h1 class="header__title is-hidden">Название списка</h1>
          <div id="list-action" class="header__action">
            <button
              id="import-button"
              class="button button--theme--transparent button--size--100-squared"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="100"
                height="100"
                fill="none"
              >
                <mask id="a" fill="transparent">
                  <path
                    d="M77 56a27 27 0 1 0-54 0h1.106a25.895 25.895 0 0 1 51.788 0H77Z"
                  />
                </mask>
                <path
                  stroke="currentColor"
                  stroke-width="2"
                  d="M77 56a27 27 0 1 0-54 0h1.106a25.895 25.895 0 0 1 51.788 0H77Z"
                  mask="url(#a)"
                />
                <path
                  stroke="currentColor"
                  d="M63.83 65.5H36.17L50 42.955 63.83 65.5Z"
                />
                <path
                  fill="currentColor"
                  d="m50 47 9.526 15.75H40.474L50 47ZM50 39l2.887-5h-5.774L50 39Zm0-22h-.5v17.5h1V17H50ZM64 58l5 2.887v-5.774L64 58Zm22 0v-.5H68.5v1H86V58ZM59.444 47l5.576-1.495-4.082-4.082L59.444 47ZM75 31.443l-.354-.353-12.374 12.374.354.354.353.353 12.375-12.374-.354-.354ZM36 58l-5-2.887v5.774L36 58Zm-22 0v.5h17.5v-1H14v.5ZM38 47l-1.495-5.577-4.082 4.082L38 47ZM22.443 31.443l-.353.354L34.464 44.17l.354-.353.353-.354L22.797 31.09l-.354.353Z"
                />
              </svg>
            </button>
            <button
              id="list-settings-button"
              class="button button--theme--transparent button--size--100-squared visually-hidden"
            >
              <svg
                width="72"
                height="72"
                viewBox="0 0 72 72"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <!-- First gear (top-left) -->
                <g transform="translate(22, 18)">
                  <!-- Gear teeth -->
                  <path d="M 14,0 L 16,0 L 16,4 L 14,4 Z" fill="currentColor" />
                  <path d="M 0,14 L 0,16 L 4,16 L 4,14 Z" fill="currentColor" />
                  <path
                    d="M 14,26 L 16,26 L 16,30 L 14,30 Z"
                    fill="currentColor"
                  />
                  <path
                    d="M 26,14 L 30,14 L 30,16 L 26,16 Z"
                    fill="currentColor"
                  />

                  <path d="M 4,4 L 7,4 L 7,7 L 4,7 Z" fill="currentColor" />
                  <path d="M 23,4 L 26,4 L 26,7 L 23,7 Z" fill="currentColor" />
                  <path d="M 4,23 L 7,23 L 7,26 L 4,26 Z" fill="currentColor" />
                  <path
                    d="M 23,23 L 26,23 L 26,26 L 23,26 Z"
                    fill="currentColor"
                  />

                  <!-- Outer circle with inner hole -->
                  <path
                    fill-rule="evenodd"
                    fill="currentColor"
                    d="
                        M 15,2 A 13,13 0 1,1 15,28 A 13,13 0 1,1 15,2 Z
                        M 15,8 A 7,7 0 1,0 15,22 A 7,7 0 1,0 15,8 Z
                      "
                  />
                </g>

                <!-- Second gear (bottom-right) -->
                <g transform="translate(32, 30)">
                  <!-- Gear teeth -->
                  <path d="M 12,0 L 14,0 L 14,3 L 12,3 Z" fill="currentColor" />
                  <path d="M 0,12 L 0,14 L 3,14 L 3,12 Z" fill="currentColor" />
                  <path
                    d="M 12,23 L 14,23 L 14,26 L 12,26 Z"
                    fill="currentColor"
                  />
                  <path
                    d="M 23,12 L 26,12 L 26,14 L 23,14 Z"
                    fill="currentColor"
                  />

                  <path d="M 3,3 L 6,3 L 6,6 L 3,6 Z" fill="currentColor" />
                  <path d="M 20,3 L 23,3 L 23,6 L 20,6 Z" fill="currentColor" />
                  <path d="M 3,20 L 6,20 L 6,23 L 3,23 Z" fill="currentColor" />
                  <path
                    d="M 20,20 L 23,20 L 23,23 L 20,23 Z"
                    fill="currentColor"
                  />

                  <!-- Outer circle with inner hole -->
                  <path
                    fill-rule="evenodd"
                    fill="currentColor"
                    d="
                      M 13,2 A 11,11 0 1,1 13,24 A 11,11 0 1,1 13,2 Z
                      M 13,7 A 6,6 0 1,0 13,19 A 6,6 0 1,0 13,7 Z
                    "
                  />
                </g>
              </svg>
            </button>
          </div>
        </div>
        <div class="content">
          <div class="navigation" id="first-step">
            <ul class="navigation__list">
              <li class="navigation__item">
                <button
                  id="nav-button-lists"
                  class="button button--theme--yellow-600-gradient button--size--116-stretched"
                >
                  Просмотреть списки
                </button>
              </li>
              <li class="navigation-item">
                <button
                  id="nav-button-tags"
                  class="button button--theme--yellow-600-gradient button--size--116-stretched"
                >
                  Просмотреть теги
                </button>
              </li>
            </ul>
          </div>

          <div class="navigation visually-hidden" id="lists">
            <h1 class="navigation__title">Твои списки дел</h1>
            <ul class="todo-lists" data-placement="lists"></ul>
          </div>

          <div class="todo-list-wrapper visually-hidden" id="todo-list">
            <button
              class="button button--size--264-stretched button--theme--transparent-bordered button--direction--column button--gap--20"
              id="add-first-todo-item"
            >
              <span class="button__icon">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="72"
                  height="72"
                  viewBox="0 0 72 72"
                  fill="none"
                >
                  <path
                    fill="currentColor"
                    d="M35.685 72 32.13 45.947h7.11L35.685 72ZM35.684 0l3.555 26.052h-7.11L35.684 0ZM72 35.684 45.947 39.24v-7.111L72 35.684ZM0 35.684l26.053-3.555v7.11L0 35.684ZM35.81 42 42 35.81l-6.19-6.189-6.189 6.19L35.811 42Z"
                  />
                  <path
                    stroke="currentColor"
                    d="m35.91 44.135 8.225-8.225-8.225-8.225-8.225 8.225 8.225 8.225Z"
                  />
                </svg>
              </span>
              <span class="button__text">Сделай первый шаг</span>
            </button>
            <div class="todo-list visually-hidden"></div>
          </div>

          <div class="tags" id="tags"></div>
        </div>
      </div>

      <div class="float-element visually-hidden">
        <button
          class="button button--size--100-circled button--theme--gray-600"
          id="modal-trigger"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="72"
            height="72"
            viewBox="0 0 72 72"
            fill="none"
          >
            <path
              fill="currentColor"
              d="M35.685 72 32.13 45.947h7.11L35.685 72ZM35.684 0l3.555 26.052h-7.11L35.684 0ZM72 35.684 45.947 39.24v-7.111L72 35.684ZM0 35.684l26.053-3.555v7.11L0 35.684ZM35.81 42 42 35.81l-6.19-6.189-6.189 6.19L35.811 42Z"
            />
            <path
              stroke="currentColor"
              d="m35.91 44.135 8.225-8.225-8.225-8.225-8.225 8.225 8.225 8.225Z"
            />
          </svg>
        </button>
      </div>

      <div class="todo-modal create-todo-list-modal is-hidden">
        <div class="outline">
          <div class="outline outline__left">
            <span
              class="separator separator--type--vertical separator--theme--gray-1100-outlined"
            ></span>
          </div>

          <div class="outline outline__right">
            <span
              class="separator separator--type--vertical separator--theme--gray-1100-outlined"
            ></span>
          </div>

          <div class="outline outline__top">
            <span class="rhombus rhombus--size--8"></span>
            <span
              class="separator separator--type--horizontal separator--theme--gray-1100-outlined has-rhombus"
            ></span>
            <span class="rhombus rhombus--size--8"></span>
            <span
              class="separator separator--type--horizontal separator--theme--gray-1100-outlined has-rhombus"
            ></span>
            <span class="rhombus rhombus--size--8"></span>
          </div>

          <div class="outline outline__bottom">
            <span class="rhombus rhombus--size--8"></span>
            <span
              class="separator separator--type--horizontal separator--theme--gray-1100-outlined has-rhombus"
            ></span>
            <span class="rhombus rhombus--size--8"></span>
            <span
              class="separator separator--type--horizontal separator--theme--gray-1100-outlined has-rhombus"
            ></span>
            <span class="rhombus rhombus--size--8"></span>
          </div>
        </div>

        <div class="todo-modal__header">
          <h2 class="todo-modal__title">Введите название списка</h2>

          <div class="todo-modal__close">
            <button
              class="button button--size--40-circled button--theme--gray-300"
              id="modal-close"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 20 20"
                fill="none"
              >
                <path
                  fill="currentColor"
                  d="M9.247 12.487 1.733 20 0 18.267l7.514-7.514 1.733 1.734ZM20 18.267 18.266 20l-7.513-7.513 1.733-1.733L20 18.267Zm-8.231-8.232-1.735 1.735-1.733-1.735 1.733-1.733 1.735 1.733ZM9.247 7.514 7.514 9.247 0 1.734 1.733 0l7.514 7.514ZM20 1.734l-7.514 7.513-1.733-1.733L18.266 0 20 1.734Z"
                />
              </svg>
            </button>
          </div>
        </div>

        <div class="todo-modal__content">
          <div class="create-todo">
            <form
              class="create-todo__form"
              action="lists.html"
              method="get"
              autocomplete="off"
              id="create-todo-list"
            >
              <label class="create-todo__label is-required">
                <p class="create-todo__name">Название:</p>
                <input
                  type="text"
                  class="create-todo__input"
                  name="title"
                  id="title"
                  placeholder="Название"
                />
              </label>

              <div class="create-todo__actions">
                <button
                  class="button button--size--60-stretched button--theme--gray-400"
                  type="reset"
                >
                  Отменить
                </button>
                <button
                  class="button button--size--60-stretched button--theme--red-300"
                  type="submit"
                >
                  Создать
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <div class="todo-modal create-todo-item-modal is-hidden">
        <div class="outline">
          <div class="outline outline__left">
            <span
              class="separator separator--type--vertical separator--theme--gray-1100-outlined"
            ></span>
          </div>

          <div class="outline outline__right">
            <span
              class="separator separator--type--vertical separator--theme--gray-1100-outlined"
            ></span>
          </div>

          <div class="outline outline__top">
            <span class="rhombus rhombus--size--8"></span>
            <span
              class="separator separator--type--horizontal separator--theme--gray-1100-outlined has-rhombus"
            ></span>
            <span class="rhombus rhombus--size--8"></span>
            <span
              class="separator separator--type--horizontal separator--theme--gray-1100-outlined has-rhombus"
            ></span>
            <span class="rhombus rhombus--size--8"></span>
          </div>

          <div class="outline outline__bottom">
            <span class="rhombus rhombus--size--8"></span>
            <span
              class="separator separator--type--horizontal separator--theme--gray-1100-outlined has-rhombus"
            ></span>
            <span class="rhombus rhombus--size--8"></span>
            <span
              class="separator separator--type--horizontal separator--theme--gray-1100-outlined has-rhombus"
            ></span>
            <span class="rhombus rhombus--size--8"></span>
          </div>
        </div>

        <div class="todo-modal__header">
          <h2 class="todo-modal__title">Заполните задачу</h2>

          <div class="todo-modal__close">
            <button
              class="button button--size--40-circled button--theme--gray-300"
              id="modal-close"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 20 20"
                fill="none"
              >
                <path
                  fill="currentColor"
                  d="M9.247 12.487 1.733 20 0 18.267l7.514-7.514 1.733 1.734ZM20 18.267 18.266 20l-7.513-7.513 1.733-1.733L20 18.267Zm-8.231-8.232-1.735 1.735-1.733-1.735 1.733-1.733 1.735 1.733ZM9.247 7.514 7.514 9.247 0 1.734 1.733 0l7.514 7.514ZM20 1.734l-7.514 7.513-1.733-1.733L18.266 0 20 1.734Z"
                />
              </svg>
            </button>
          </div>
        </div>

        <div class="todo-modal__content">
          <div class="create-todo">
            <form
              class="create-todo__form create-todo-item__form"
              action="list.html"
              method="get"
              autocomplete="off"
              id="create-todo-item"
            >
              <label class="create-todo__label is-required">
                <p class="create-todo__name">Название:</p>
                <input
                  type="text"
                  class="create-todo__input"
                  name="title"
                  id="title"
                  placeholder="Название"
                />
              </label>

              <label class="create-todo__label">
                <p class="create-todo__name">Приоритет:</p>
                <input
                  type="radio"
                  class="create-todo__radio"
                  name="priority"
                  value="low"
                />
                <input
                  type="radio"
                  class="create-todo__radio"
                  name="priority"
                  value="medium"
                />
                <input
                  type="radio"
                  class="create-todo__radio"
                  name="priority"
                  value="high"
                />
              </label>

              <label class="create-todo__label">
                <p class="create-todo__name">Описание:</p>
                <input
                  type="text"
                  class="create-todo__input"
                  name="description"
                  id="description"
                  placeholder="Описание элемента списка"
                />
              </label>

              <label class="create-todo__label">
                <p class="create-todo__name">Дедлайн:</p>
                <input
                  type="date"
                  id="date"
                  class="create-todo__input"
                  name="date"
                />
              </label>

              <label class="create-todo__label">
                <p class="create-todo__name">Испольнитель:</p>
                <select
                  class="create-todo__select"
                  name="assignee"
                  id="assignee"
                >
                  <option
                    class="create-todo__option"
                    value="default-value"
                    id="default-value"
                  >
                    Имя
                  </option>
                </select>
              </label>

              <div class="create-todo__actions">
                <button
                  class="button button--size--60-stretched button--theme--gray-400"
                  type="reset"
                >
                  Отменить
                </button>
                <button
                  class="button button--size--60-stretched button--theme--red-300"
                  type="submit"
                >
                  Создать
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <div class="modal-backdrop is-hidden"></div>
    </div>
    <script type="module" src="/src/index.js"></script>

    <template id="todo-list-sidebar">
      <li class="todo-lists__item" data-placement="sidebar">
        <button
          class="button button--size--48-hug button--theme--transparent-underlined is-separator-enabled button--align--start"
        >
          <span class="button__text"> Первый список </span>
          <span class="button__separator">
            <span
              class="separator separator--type--horizontal separator--theme--gray-1100-outlined has-rhombus"
            ></span>
            <span class="rhombus rhombus--size--8"></span>
            <span
              class="separator separator--type--horizontal separator--theme--gray-1100-outlined has-rhombus"
            ></span>
          </span>
        </button>
      </li>
    </template>

    <template id="todo-list-page">
      <li class="todo-lists__item" data-placement="page">
        <button
          class="button button--theme--transparent-underlined button--size--48-stretched button--align--start is-separator-enabled"
        >
          <span class="button__text">item title</span>
          <span class="button__separator">
            <span
              class="separator separator--type--horizontal separator--theme--gray-1100-outlined has-rhombus"
            ></span>
            <span class="rhombus rhombus--size--8"></span>
            <span
              class="separator separator--type--horizontal separator--theme--gray-1100-outlined has-rhombus"
            ></span>
          </span>
        </button>
      </li>
    </template>

    <template id="todo-item">
      <li class="todo-item">
        <p class="todo-item__title"></p>
        <p class="todo-item__description"></p>
        <p class="todo-item__priority"></p>
        <p class="todo-item__assignee"></p>
        <div class="todo-item__buttons">
          <button
            id="update-todo"
            class="button button--theme--transparent button--size--100-squared"
          >
            Update
          </button>
          <button
            id="delete-todo"
            class="button button--theme--transparent button--size--100-squared"
          >
            Delete
          </button>
        </div>
      </li>
    </template>

    <template id="create-todo__option">
      <option
        class="create-todo__option"
        value="default-value"
        id="default-value"
      >
        Имя
      </option>
    </template>
  </body>
</html>
